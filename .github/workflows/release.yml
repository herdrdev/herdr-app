# RHEL 8 x86_64 release build. This replaces the old multi-platform release
# workflow: the app links the system's glibc, so building inside an AlmaLinux 8
# container (glibc 2.28) sets the distro floor. No Windows, macOS, aarch64,
# tests, signing, or publishing here. Pack with scripts/package, verify, upload.
name: rhel8 release build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhel8-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  # In the cache key and the build: ghostty-sys can't tell when Zig changes.
  ZIG_VERSION: 0.16.0
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    container: quay.io/almalinux/almalinux:8@sha256:b068b59649ddecf7c95cea3d3f16941eaf1d8a77fcf6ce94c779abae7552e2ea
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The image is minimal and actions/checkout needs git. A bounded retry
      # keeps a stuck mirror from eating the whole job timeout.
      - name: Bootstrap container tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The pinned 8.x image ships an old RPM-GPG-KEY-AlmaLinux; current
          # packages are signed with newer keys. Refresh from the official
          # HTTPS keyring instead of disabling gpgcheck.
          curl -fsSLo /etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux \
            https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux
          rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux
          install() { dnf install -y --setopt=install_weak_deps=False "$@"; }
          if ! install ca-certificates curl tar gzip git python3 binutils; then
            dnf clean all
            install ca-certificates curl tar gzip git python3 binutils
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # The container runs as root while the mounted workspace is owned by
      # the runner user; git otherwise refuses to look at the checkout.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Linux build dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ pkgconf-pkg-config clang clang-devel \
            libxcb-devel libxkbcommon-devel libxkbcommon-x11 \
            wayland-devel vulkan-devel fontconfig-devel freetype-devel
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      - name: Build and pack for RHEL 8 x86_64
        run: scripts/package x86_64-unknown-linux-gnu
      - name: Build herdr-core and repack tarball
        run: |
          set -euo pipefail
          core_ver=$(tr -d '[:space:]' < distribution/core-version)
          core_src=$(mktemp -d)
          git clone --depth 1 --branch "v$core_ver" https://github.com/herdrdev/herdr-core.git "$core_src"
          git -C "$core_src" submodule update --init --depth 1
          cargo build --manifest-path "$core_src/Cargo.toml" --locked --release -p herdr-core
          work=$(mktemp -d)
          tar -xzf dist/herdr-app-linux-x86_64.tar.gz -C "$work"
          cp "$core_src/target/release/herdr-core" "$work/herdr-app/herdr-core"
          ln -s herdr-core "$work/herdr-app/hc"
          tar -czf dist/herdr-app-rhel8-x86_64.tar.gz -C "$work" herdr-app
      - name: Check glibc floor
        run: |
          set -euo pipefail
          ldd --version | head -1
          work=$(mktemp -d)
          tar -xzf dist/herdr-app-rhel8-x86_64.tar.gz -C "$work"
          for bin in "$work/herdr-app/herdr-app" "$work/herdr-app/herdr-core"; do
            max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -Vu | tail -1 | cut -d_ -f2)
            echo "$(basename "$bin"): highest GLIBC symbol version required: $max"
            [ -n "$max" ] || { echo "no GLIBC symbols found in $bin; check objdump"; exit 1; }
            [ "$(printf '%s\n' "$max" 2.28 | sort -V | head -1)" = "$max" ] || { echo "$bin needs glibc newer than 2.28"; exit 1; }
          done
      - name: Verify tarball and smoke test
        run: |
          set -euo pipefail
          archive=dist/herdr-app-rhel8-x86_64.tar.gz
          for f in herdr-app herdr-core hc herdr-app.svg LICENSE THIRD-PARTY-NOTICES; do
            tar -tzf "$archive" "herdr-app/$f" >/dev/null
          done
          tar -xOf "$archive" herdr-app/LICENSE | cmp - LICENSE
          tar -xOf "$archive" herdr-app/THIRD-PARTY-NOTICES | cmp - THIRD-PARTY-NOTICES
          work=$(mktemp -d)
          tar -xzf "$archive" -C "$work"
          HERDR_APP_HOME="$work/home" "$work/herdr-app/herdr-app" --help
          "$work/herdr-app/herdr-core" --version
          "$work/herdr-app/hc" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-rhel8-x86_64
          path: dist/herdr-app-rhel8-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
