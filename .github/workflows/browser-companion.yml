name: Browser companion
on:
  pull_request:
    paths: ['contrib/browser/**', '.github/workflows/browser-companion.yml']
  push:
    branches: ['feat/browser-agent-api']
    paths: ['contrib/browser/**', '.github/workflows/browser-companion.yml']
permissions:
  contents: read
jobs:
  browser:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: contrib/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contrib/browser/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          HERDR_BROWSER_TEST_CHANNEL: chromium
