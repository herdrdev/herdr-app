name: sync upstream

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'alexshpunt/herdr-app'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      branch: ${{ steps.candidate.outputs.branch }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare a candidate without changing master
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          result=$(python3 scripts/fork-sync.py prepare --branch "automation/upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          printf '%s\n' "$result"
          printf '%s\n' "$result" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read
  land:
    needs: [prepare, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-forward master to the exact verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.branch }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh auth setup-git
          python3 scripts/fork-sync.py land --branch "$CANDIDATE_BRANCH" --sha "$CANDIDATE_SHA"
